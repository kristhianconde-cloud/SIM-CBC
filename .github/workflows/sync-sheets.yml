name: Sincronizar Google Sheets a sigeca_db.json

on:
  # Permite ejecutar la sincronización manualmente desde la pestaña 'Actions' de GitHub
  workflow_dispatch:

  # Ejecución automática periódica (Cada 6 horas: 00:00, 06:00, 12:00, 18:00 UTC)
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    name: Sincronizar Datos desde Google Sheets
    runs-on: ubuntu-latest
    if: ${{ secrets.GCP_SA_KEY != '' && secrets.SPREADSHEET_ID != '' }}

    steps:
      - name: 1. Descargar repositorio (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Instalar librerías oficiales de Google API
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: 4. Ejecutar script de sincronización
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python scripts/sync_sheets.py

      - name: 5. Detectar cambios y hacer Commit / Push automático
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Agregar el archivo de base de datos
          git add sigeca_db.json
          
          # Verificar si hay cambios preparados
          if git diff --staged --quiet; then
            echo "✅ No hay cambios nuevos en Google Sheets. La base de datos ya está al día."
          else
            echo "🚀 Cambios detectados. Guardando y publicando en el repositorio..."
            git commit -m "chore(data): auto-sync sigeca_db.json from Google Sheets [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "🎉 Base de datos sincronizada y publicada exitosamente."
          fi
